[project]
name = "hdr-blaster"
version = "3.1.3"
description = "Convert NVIDIA HDR captures to SDR with intelligent tone mapping"
requires-python = ">=3.14"
# Exact versions: the rendering is verified bit for bit against the original on this
# environment, and the CUDA DLL trim in NHC.spec was validated on torch 2.11.0+cu130.
# Upgrade deliberately, then rerun `pytest --full` and validate the trim again (BUILD.md).
dependencies = [
    "torch==2.11.0",
    "numpy==2.4.3",
    "pillow==12.1.1",
    "imagecodecs==2026.5.10",
    "tifffile==2026.5.2",
    "av==19.0.2",
    "pyside6-essentials==6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pyflakes>=4.1",
    "pyinstaller>=6.20",
    "psutil>=7.2",
]

# torch must come from the PyTorch index to get the CUDA build. A plain
# `uv sync` against PyPI would replace it with a CPU-only wheel.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
